<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura Web</title>
    <link rel="stylesheet" href="./css/estilo.css">
</head>
<body>
    <div class="contenedor">
    <h1>Proyecto factura web</h1>
    <form action="" method="get">
        <input type="text" name="id" id="id" placeholder="Ingrese su identificación"><br><br>
        <input type="text" name="nom" id="nom" placeholder="Ingrese su nombre completo"><br><br>
        <input type="text" name="dir" id="dir" placeholder="Ingrese su dirección"><br><br>
        <input type="text" name="telf" id="telf" placeholder="Ingrese un telefono"><br><br>
        <input type="text" name="nfac" id="nfac" placeholder="Ingrese numero de factura"><br><br>
        <input type="text" name="fecha" id="fecha" placeholder="Ingrese fecha de facturación"><br><br>
        <input type="text" name="rs" id="rs" placeholder="Ingrese razon social"><br><br>
        <input type="text" name="p" id="p" placeholder="Ingrese producto"><br><br>
        <input type="text" name="cant" id="cant" placeholder="Ingrese cantidad de producto"><br><br>
        <input type="text" name="vu" id="vu" placeholder="Ingrese valor unitario del prodcuto"><br><br>
        <input type="button" value="Mostar factura" onclick="buscar()">
    </form>
    </div>
    <script src="./JS/main.js"></script>
</body>
</html>
